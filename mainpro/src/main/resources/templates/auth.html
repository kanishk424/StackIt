<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>StackIt Auth</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ["Inter", "sans-serif"]
                    }
                }
            }
        };
    </script>
</head>
<body class="bg-zinc-950 text-zinc-100 font-sans antialiased" style="background:#09090b;">
<div class="min-h-screen flex items-center justify-center px-4 py-10">
    <div class="w-full max-w-5xl overflow-hidden rounded-3xl border border-zinc-800 bg-zinc-900/40 shadow-2xl backdrop-blur">
        <div class="grid md:grid-cols-2">
            <div class="hidden md:flex flex-col justify-between p-10 border-r border-zinc-800 bg-zinc-900/30">
                <div>
                    <p class="inline-flex items-center rounded-full border border-zinc-700 bg-zinc-900/70 px-3 py-1 text-xs text-zinc-300">
                        Premium Knowledge Network
                    </p>
                    <h1 class="mt-6 text-4xl font-black tracking-tight text-zinc-100">
                        Welcome to StackIt
                    </h1>
                    <p class="mt-3 text-sm text-zinc-400 max-w-md">
                        Ask better questions, publish trusted answers, and grow your developer credibility.
                    </p>
                </div>

                <div class="grid grid-cols-3 gap-3">
                    <div class="rounded-xl border border-zinc-800 bg-zinc-900 p-3">
                        <p class="text-xs text-zinc-400">Questions</p>
                        <p class="mt-1 text-xl font-bold text-zinc-100">1.2K+</p>
                    </div>
                    <div class="rounded-xl border border-zinc-800 bg-zinc-900 p-3">
                        <p class="text-xs text-zinc-400">Answers</p>
                        <p class="mt-1 text-xl font-bold text-zinc-100">8.4K+</p>
                    </div>
                    <div class="rounded-xl border border-zinc-800 bg-zinc-900 p-3">
                        <p class="text-xs text-zinc-400">Users</p>
                        <p class="mt-1 text-xl font-bold text-zinc-100">540+</p>
                    </div>
                </div>
            </div>

            <div class="p-6 sm:p-8 md:p-10">
                <div class="mb-8 flex items-center justify-between">
                    <div>
                        <h2 class="text-3xl font-extrabold tracking-tight text-zinc-100">Welcome</h2>
                        <p class="mt-1 text-sm text-zinc-400">Login or create a new account</p>
                    </div>
                    <span class="rounded-xl border border-zinc-800 bg-zinc-900 px-3 py-2 text-sm font-semibold text-zinc-100">
                        StackIt
                    </span>
                </div>

                <div class="mb-6 grid grid-cols-2 rounded-xl border border-zinc-800 bg-zinc-900/70 p-1">
                    <button id="loginTab" type="button"
                            class="rounded-lg px-4 py-2.5 text-sm font-semibold transition bg-zinc-100 text-zinc-900">
                        Login
                    </button>
                    <button id="registerTab" type="button"
                            class="rounded-lg px-4 py-2.5 text-sm font-semibold text-zinc-300 transition hover:text-zinc-100">
                        Register
                    </button>
                </div>

                <form id="loginForm" class="space-y-4">
                    <div>
                        <label class="mb-1 block text-sm text-zinc-300">Email</label>
                        <input id="loginEmail" type="email" required placeholder="Enter your email"
                               class="w-full rounded-xl border border-zinc-700 bg-zinc-950 px-3 py-2 text-zinc-100 outline-none focus:border-zinc-500" />
                    </div>
                    <div>
                        <label class="mb-1 block text-sm text-zinc-300">Password</label>
                        <input id="loginPassword" type="password" required placeholder="Enter your password"
                               class="w-full rounded-xl border border-zinc-700 bg-zinc-950 px-3 py-2 text-zinc-100 outline-none focus:border-zinc-500" />
                    </div>

                    <button type="submit"
                            class="w-full rounded-xl bg-indigo-600 px-4 py-2.5 text-sm font-semibold text-white hover:bg-indigo-500">
                        Login
                    </button>
                </form>

                <form id="registerForm" class="hidden space-y-4">
                    <div>
                        <label class="mb-1 block text-sm text-zinc-300">Username</label>
                        <input id="registerUsername" type="text" required placeholder="Choose a username"
                               class="w-full rounded-xl border border-zinc-700 bg-zinc-950 px-3 py-2 text-zinc-100 outline-none focus:border-zinc-500" />
                    </div>
                    <div>
                        <label class="mb-1 block text-sm text-zinc-300">Email</label>
                        <input id="registerEmail" type="email" required placeholder="Enter your email"
                               class="w-full rounded-xl border border-zinc-700 bg-zinc-950 px-3 py-2 text-zinc-100 outline-none focus:border-zinc-500" />
                    </div>
                    <div>
                        <label class="mb-1 block text-sm text-zinc-300">Password</label>
                        <input id="registerPassword" type="password" required placeholder="Create a password"
                               class="w-full rounded-xl border border-zinc-700 bg-zinc-950 px-3 py-2 text-zinc-100 outline-none focus:border-zinc-500" />
                    </div>

                    <button type="submit"
                            class="w-full rounded-xl bg-indigo-600 px-4 py-2.5 text-sm font-semibold text-white hover:bg-indigo-500">
                        Register
                    </button>
                </form>

                <p class="mt-6 text-center text-sm text-zinc-400">
                    <span id="switchText">Don't have an account?</span>
                    <button id="switchLink" type="button" class="ml-1 font-semibold text-indigo-400 hover:text-indigo-300">
                        Switch to Register
                    </button>
                </p>
            </div>
        </div>
    </div>
</div>

<script>
    const API_BASE = "http://localhost:8080/api/auth";

    const loginTab = document.getElementById("loginTab");
    const registerTab = document.getElementById("registerTab");
    const loginForm = document.getElementById("loginForm");
    const registerForm = document.getElementById("registerForm");
    const switchLink = document.getElementById("switchLink");
    const switchText = document.getElementById("switchText");

    function setMode(mode) {
        const isLogin = mode === "login";

        loginForm.classList.toggle("hidden", !isLogin);
        registerForm.classList.toggle("hidden", isLogin);

        loginTab.classList.toggle("bg-zinc-100", isLogin);
        loginTab.classList.toggle("text-zinc-900", isLogin);
        loginTab.classList.toggle("text-zinc-300", !isLogin);

        registerTab.classList.toggle("bg-zinc-100", !isLogin);
        registerTab.classList.toggle("text-zinc-900", !isLogin);
        registerTab.classList.toggle("text-zinc-300", isLogin);

        switchText.textContent = isLogin ? "Don't have an account?" : "Already have an account?";
        switchLink.textContent = isLogin ? "Switch to Register" : "Switch to Login";
    }

    async function callAuth(endpoint, payload, failMessage, mode) {
        try {
            const response = await fetch(`${API_BASE}${endpoint}`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(payload)
            });

            const data = await response.json().catch(() => ({}));

            if (!response.ok) {
                alert(data.message || failMessage);
                return;
            }

            // Backend currently returns: userId, username, email (no token yet)
            const user = {
                id: data.userId ?? data.id ?? null,
                name: data.username ?? data.name ?? "",
                username: data.username ?? "",
                email: data.email ?? "",
                token: data.token ?? "" // keep key for future JWT support
            };

            // Required guard key
            localStorage.setItem("user", JSON.stringify(user));

            // Backward compatibility with dashboard existing keys
            if (user.id != null) localStorage.setItem("userId", String(user.id));
            if (user.username) localStorage.setItem("username", user.username);
            if (user.name) localStorage.setItem("displayName", user.name);

            // Requirement: redirect immediately after store
            if (mode === "login") {
                window.location.href = "dashboard.html";
                return;
            }

            // Optional behavior after register: go to login tab
            alert("Registration successful. Please login.");
            setMode("login");
        } catch (err) {
            console.error("Auth error:", err);
            alert(failMessage);
        }
    }

    loginForm.addEventListener("submit", (e) => {
        e.preventDefault();
        const email = document.getElementById("loginEmail").value.trim();
        const password = document.getElementById("loginPassword").value;
        callAuth("/login", { email, password }, "Login Failed", "login");
    });

    registerForm.addEventListener("submit", (e) => {
        e.preventDefault();
        const username = document.getElementById("registerUsername").value.trim();
        const email = document.getElementById("registerEmail").value.trim();
        const password = document.getElementById("registerPassword").value;
        callAuth("/register", { username, email, password }, "Registration Failed", "register");
    });

    loginTab.addEventListener("click", () => setMode("login"));
    registerTab.addEventListener("click", () => setMode("register"));
    switchLink.addEventListener("click", () => {
        setMode(loginForm.classList.contains("hidden") ? "login" : "register");
    });

    setMode("login");
</script>
</body>
</html>
